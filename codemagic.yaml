workflows:
  # Unsigned PR / CI compilation workflow (does not require Apple signing credentials)
  ios-kmp-workflow:
    name: iOS Build & Verify (Unsigned / PR Verification)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Make gradlew executable & Build KMP Shared Framework
        script: |
          chmod +x gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64 :shared:linkReleaseFrameworkIosX64 :shared:assemble
      - name: Build iOS Archive (.xcarchive)
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/xcarchive/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/ios/xcarchive/*.xcarchive

  # Production App Store & TestFlight signed release candidate workflow
  ios-app-store-release:
    name: iOS App Store & TestFlight Release Candidate
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      groups:
        - app_store_credentials # External Codemagic secret group: APP_STORE_CONNECT_PRIVATE_KEY, CERT_KEY, etc.
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "com.mipastudio.memostamp"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Make gradlew executable & Build KMP Shared Framework
        script: |
          chmod +x gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64 :shared:assemble

      - name: Set up code signing settings on Xcode project
        script: |
          set -euo pipefail
          # Initialize temporary build keychain
          keychain initialize

          # 1. Decode provisioning profile if provided via Codemagic environment (CM_PROVISIONING_PROFILE)
          if [ -n "${CM_PROVISIONING_PROFILE:-}" ]; then
            echo "Installing provisioning profile from CM_PROVISIONING_PROFILE..."
            PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILES_HOME"
            echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_HOME/$(uuidgen).mobileprovision"
          fi

          # 2. Decode & import certificate if provided via Codemagic environment (CM_CERTIFICATE)
          if [ -n "${CM_CERTIFICATE:-}" ]; then
            echo "Importing certificate from CM_CERTIFICATE into keychain..."
            echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
            keychain add-certificates --certificate /tmp/certificate.p12 ${CM_CERTIFICATE_PASSWORD:+--certificate-password "$CM_CERTIFICATE_PASSWORD"}
          fi

          # 3. If App Store Connect API credentials are present, fetch or generate signing files
          if [ -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ] && [ -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" ] && [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "Fetching signing files via App Store Connect API..."
            if ! app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create; then
              echo "[WARNING] app-store-connect fetch-signing-files returned non-zero exit code. Checking if manual profiles exist..."
            fi
          fi

          # Add any certificates present in environment to keychain
          keychain add-certificates || true

          # Apply matching profiles and certificates to Xcode project and export options plist
          xcode-project use-profiles --project "$XCODE_PROJECT" --export-options-plist /tmp/export_options.plist --warn-only || true

          # Canonical iOS Signing Context Resolution & Audit
          python3 scripts/resolve_ios_signing_context.py \
            --bundle-id "$BUNDLE_ID" \
            --output-env /tmp/signing_context.env

      - name: Build iOS App Store Archive (.xcarchive)
        script: |
          # Overrides MARKETING_VERSION and CURRENT_PROJECT_VERSION externally without source edits
          TARGET_VERSION="${MEMOSTAMP_VERSION_NAME:-1.0}"
          TARGET_BUILD="${MEMOSTAMP_VERSION_CODE:-1}"

          # Source resolved signing context if available
          if [ -f /tmp/signing_context.env ]; then
            source /tmp/signing_context.env
          fi

          DEV_TEAM="${RESOLVED_DEVELOPMENT_TEAM:-${DEVELOPMENT_TEAM:-${APNS_TEAM_ID:-${APPLE_TEAM_ID:-}}}}"
          if [[ "$DEV_TEAM" == *'${'* || "$DEV_TEAM" == *'}'* ]]; then
            DEV_TEAM=""
          fi
          echo "Archiving Release for generic/platform=iOS with version $TARGET_VERSION ($TARGET_BUILD)..."

          EXTRA_ARCHIVE_ARGS=()
          if [ -n "$DEV_TEAM" ]; then
            EXTRA_ARCHIVE_ARGS+=("DEVELOPMENT_TEAM=$DEV_TEAM")
          fi

          if [ "${SIGNING_CONFIG_READY:-false}" = "true" ]; then
            echo "Signing configuration ready. Archiving with Manual code signing..."
            EXTRA_ARCHIVE_ARGS+=("CODE_SIGN_STYLE=Manual")
          else
            echo "[WARNING] Apple distribution credentials or matching App Store profile not found in runner environment."
            echo "Archiving with CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual (signing will occur during exportArchive when credentials are present)."
            EXTRA_ARCHIVE_ARGS+=("CODE_SIGNING_ALLOWED=NO" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGN_STYLE=Manual")
          fi

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/xcarchive/iosApp.xcarchive \
            MARKETING_VERSION="$TARGET_VERSION" \
            CURRENT_PROJECT_VERSION="$TARGET_BUILD" \
            "${EXTRA_ARCHIVE_ARGS[@]}"

      - name: Export Signed IPA for App Store / TestFlight
        script: |
          set -euo pipefail

          if [ -f /tmp/signing_context.env ]; then
            source /tmp/signing_context.env
          fi

          # Fail early if signing credentials or matching App Store profile are missing
          if [ "${SIGNING_CONFIG_READY:-false}" != "true" ]; then
            echo "================================================================="
            echo "[ERROR] EXTERNAL_SETUP_REQUIRED: Apple distribution credentials or matching App Store provisioning profile missing!"
            echo "Cannot export signed IPA without a valid Apple Distribution identity and matching App Store profile for $BUNDLE_ID."
            echo "Remediation:"
            echo "  1. Codemagic secret group 'app_store_credentials':"
            echo "     - APP_STORE_CONNECT_PRIVATE_KEY"
            echo "     - APP_STORE_CONNECT_KEY_IDENTIFIER"
            echo "     - APP_STORE_CONNECT_ISSUER_ID"
            echo "  2. OR Codemagic UI identities / environment variables:"
            echo "     - CM_CERTIFICATE (base64 .p12)"
            echo "     - CM_CERTIFICATE_PASSWORD"
            echo "     - CM_PROVISIONING_PROFILE (base64 .mobileprovision)"
            echo "================================================================="
            exit 1
          fi

          RESOLVED_EXPORT_OPTIONS="/tmp/resolved_export_options.plist"

          echo "Resolving and validating ExportOptions.plist contract..."
          python3 scripts/resolve_ios_export_options.py \
            --dynamic-plist "/tmp/export_options.plist" \
            --static-plist "iosApp/ExportOptions-AppStore.plist" \
            --output-plist "$RESOLVED_EXPORT_OPTIONS" \
            --bundle-id "$BUNDLE_ID" \
            ${RESOLVED_DEVELOPMENT_TEAM:+--team-id "$RESOLVED_DEVELOPMENT_TEAM"}

          echo "Exporting signed IPA for distribution using $RESOLVED_EXPORT_OPTIONS..."
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/iosApp.xcarchive \
            -exportOptionsPlist "$RESOLVED_EXPORT_OPTIONS" \
            -exportPath build/ios/ipa

      - name: Verify Signed IPA & APNs Production Entitlement
        script: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n 1 || true)
          if [ -z "$IPA_PATH" ]; then
            echo "[ERROR] No exported IPA found in build/ios/ipa!"
            echo "To produce a signed release candidate IPA, provide Apple distribution signing credentials:"
            echo "  - Codemagic secret group 'app_store_credentials': APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID"
            echo "  - OR Codemagic UI identities: CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE"
            exit 1
          fi
          echo "Inspecting exported IPA: $IPA_PATH"

          # Extract Payload to inspect signed application bundle
          EXTRACT_DIR="/tmp/ipa_inspect"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$IPA_PATH" -d "$EXTRACT_DIR"
          APP_PATH=$(find "$EXTRACT_DIR/Payload" -maxdepth 1 -name "*.app" | head -n 1)

          echo "Validating signature of $APP_PATH..."
          codesign -v --verbose=2 "$APP_PATH"

          echo "Inspecting entitlements for production APNs..."
          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>&1 || true)
          echo "$ENTITLEMENTS" | grep -A 1 'aps-environment' | grep -q 'production' || {
            echo "[ERROR] Signed IPA does not have production aps-environment entitlement!"
            exit 1
          }
          echo "[PASS] Signed IPA verified: valid signature, aps-environment = production."
          rm -rf "$EXTRACT_DIR"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
