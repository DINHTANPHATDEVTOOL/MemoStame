name: CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend_security:
    name: Backend SQL Migrations & RLS Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Environment
        run: |
          set -euo pipefail
          supabase start

      - name: Run Real Supabase Migration Chain (db reset)
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Real RLS Executable Test Harness
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/rls_negative_tests.sql

      - name: Start & Verify Local Edge Functions (delete-account, dispatch-push, accept-trade, maps-grounding)
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json 2>/dev/null || true)
          PARSED_KEY=$(python3 -c "import json, sys; d=json.loads(sys.argv[1]); print(d.get('SERVICE_ROLE_KEY') or d.get('service_role_key') or '')" "$STATUS_JSON" 2>/dev/null || true)
          if [ -n "$PARSED_KEY" ]; then
            export SUPABASE_SERVICE_ROLE_KEY="$PARSED_KEY"
            printf "SUPABASE_SERVICE_ROLE_KEY=%s\nPUSH_PROVIDER_MODE=mock\nMOCK_PUSH_URL=http://127.0.0.1:54325/mock-push\nGEMINI_PROVIDER_MODE=mock\nMOCK_GEMINI_URL=http://127.0.0.1:54326/mock-gemini\nGEMINI_API_KEY=test-mock-gemini-key\n" "$PARSED_KEY" > supabase/functions/.env
          fi
          supabase functions serve --no-verify-jwt > /tmp/supabase_functions.log 2>&1 &
          echo $! > /tmp/supabase_functions.pid

          READY=0
          for i in $(seq 1 30); do
            CODE_DEL=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "http://127.0.0.1:54321/functions/v1/delete-account" 2>/dev/null || true)
            CODE_PUSH=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "http://127.0.0.1:54321/functions/v1/dispatch-push" 2>/dev/null || true)
            CODE_TRADE=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "http://127.0.0.1:54321/functions/v1/accept-trade" 2>/dev/null || true)
            CODE_MAPS=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "http://127.0.0.1:54321/functions/v1/maps-grounding" 2>/dev/null || true)
            if ([ "$CODE_DEL" = "200" ] || [ "$CODE_DEL" = "401" ] || [ "$CODE_DEL" = "405" ]) && \
               ([ "$CODE_PUSH" = "200" ] || [ "$CODE_PUSH" = "401" ] || [ "$CODE_PUSH" = "405" ]) && \
               ([ "$CODE_TRADE" = "200" ] || [ "$CODE_TRADE" = "401" ] || [ "$CODE_TRADE" = "405" ]) && \
               ([ "$CODE_MAPS" = "200" ] || [ "$CODE_MAPS" = "401" ] || [ "$CODE_MAPS" = "405" ]); then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "[ERROR] Local Edge Functions failed to become ready"
            cat /tmp/supabase_functions.log || true
            exit 1
          fi
          echo "Local Edge Functions (delete-account, dispatch-push, accept-trade, maps-grounding) are ready."

      - name: Run Black-Box Multi-User E2E Contract Tests
        run: |
          set -euo pipefail
          ./supabase/tests/run_e2e_contract_tests.sh

      - name: Cleanup Local Edge Functions Process
        if: always()
        run: |
          rm -f supabase/functions/.env
          if [ -f /tmp/supabase_functions.pid ]; then
            kill $(cat /tmp/supabase_functions.pid) 2>/dev/null || true
          fi

  build_ios:
    name: Build KMP Shared & Swift iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP Shared Framework
        run: |
          chmod +x gradlew
          ./gradlew :shared:build

      - name: Verify & Build iOS Swift App via Xcode (Release)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

  build_android:
    name: Build KMP Shared & Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP Shared & Android App
        run: |
          chmod +x gradlew
          ./gradlew \
            :shared:build \
            :androidApp:testDebugUnitTest \
            :androidApp:assembleDebug \
            :androidApp:testReleaseUnitTest \
            :androidApp:lintRelease \
            :androidApp:assembleRelease \
            --no-daemon

      - name: Generate Ephemeral CI Keystore & Build Signed Release Bundle
        env:
          MEMOSTAMP_RELEASE_STORE_FILE: /tmp/ci_ephemeral_keystore.jks
          MEMOSTAMP_RELEASE_STORE_PASSWORD: ci_ephemeral_pass123
          MEMOSTAMP_RELEASE_KEY_ALIAS: ci_ephemeral_key
          MEMOSTAMP_RELEASE_KEY_PASSWORD: ci_ephemeral_pass123
          MEMOSTAMP_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          # 1. Create temporary disposable keystore with keytool (PKCS12 standard requires identical storepass and keypass)
          keytool -genkeypair -v \
            -keystore /tmp/ci_ephemeral_keystore.jks \
            -storepass ci_ephemeral_pass123 \
            -alias ci_ephemeral_key \
            -keypass ci_ephemeral_pass123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI Ephemeral, OU=CI, O=MemoStamp, L=San Francisco, ST=California, C=US"

          # 2 & 3. Run Release bundle build with ephemeral signing
          ./gradlew :androidApp:bundleRelease --no-daemon

          # 4. Verify AAB signature deterministically using jarsigner
          echo "Verifying signed Release AAB..."
          AAB_FILE="androidApp/build/outputs/bundle/release/androidApp-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "[ERROR] Release AAB file not found at $AAB_FILE"
            exit 1
          fi
          jarsigner -verify -verbose "$AAB_FILE" | grep -q "jar verified" || {
            echo "[ERROR] Release AAB verification failed: AAB is not signed!"
            exit 1
          }
          echo "[PASS] Release AAB successfully signed and verified with ephemeral CI keystore."

      - name: Cleanup Ephemeral Keystore
        if: always()
        run: |
          rm -f /tmp/ci_ephemeral_keystore.jks
