name: CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend_security:
    name: Backend SQL Migrations & RLS Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Environment
        run: |
          set -euo pipefail
          supabase start

      - name: Run Real Supabase Migration Chain (db reset)
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Real RLS Executable Test Harness
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/rls_negative_tests.sql

      - name: Start & Verify Delete-Account Local Edge Function
        run: |
          set -euo pipefail
          STATUS_JSON=$(supabase status -o json 2>/dev/null || true)
          PARSED_KEY=$(python3 -c "import json, sys; d=json.loads(sys.argv[1]); print(d.get('SERVICE_ROLE_KEY') or d.get('service_role_key') or '')" "$STATUS_JSON" 2>/dev/null || true)
          if [ -n "$PARSED_KEY" ]; then
            export SUPABASE_SERVICE_ROLE_KEY="$PARSED_KEY"
          fi
          supabase functions serve delete-account --no-verify-jwt > /tmp/delete_account_function.log 2>&1 &
          echo $! > /tmp/delete_account_function.pid

          READY=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "http://127.0.0.1:54321/functions/v1/delete-account" 2>/dev/null || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || [ "$CODE" = "405" ]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "[ERROR] delete-account function failed to become ready"
            cat /tmp/delete_account_function.log || true
            exit 1
          fi
          echo "delete-account local function is ready."

      - name: Run Black-Box Multi-User E2E Contract Tests
        run: |
          set -euo pipefail
          ./supabase/tests/run_e2e_contract_tests.sh

      - name: Cleanup Delete-Account Function Process
        if: always()
        run: |
          if [ -f /tmp/delete_account_function.pid ]; then
            kill $(cat /tmp/delete_account_function.pid) 2>/dev/null || true
          fi

  build_ios:
    name: Build KMP Shared & Swift iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP Shared Framework
        run: |
          chmod +x gradlew
          ./gradlew :shared:build

      - name: Verify & Build iOS Swift App via Xcode (Release)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

  build_android:
    name: Build KMP Shared & Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP Shared & Android App
        run: |
          chmod +x gradlew
          ./gradlew \
            :shared:build \
            :androidApp:testDebugUnitTest \
            :androidApp:assembleDebug \
            :androidApp:testReleaseUnitTest \
            :androidApp:lintRelease \
            :androidApp:assembleRelease \
            :androidApp:bundleRelease \
            --no-daemon
